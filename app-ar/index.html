<head>
<meta charset="utf-8">

<title>Fecha Libre · salí de tus deudas lo más rápido posible</title>

<style>
:root{
  --bg:#F7F5EF; --card:#FFFFFF; --ink:#27352F; --muted:#56635C; --line:#E7E3D8;
  --brand:#245B48; --brand2:#245B48; --accent:#E9A27E; --danger:#B4533B; --ok:#245B48;
  --soft:#DCEDE2; --warn:#FBEADF; --warnink:#7A4327;
  --fh:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --fb:"DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--fb);font-variant-numeric:tabular-nums}
button,input,select{font:inherit}
::selection{background:#CDE5D6;color:var(--ink)}
input{caret-color:var(--brand)}
input::placeholder{color:#66726B;opacity:1}
h1,h2,h3,.big,.brand{font-family:var(--fh)}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:var(--bg);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;font-size:19px;font-weight:700;color:var(--brand);letter-spacing:-.2px}
.logo{width:30px;height:30px;flex:none}
.iconbtn{background:transparent;border:0;color:var(--brand);font-size:22px;min-width:44px;min-height:44px;cursor:pointer}
main{max-width:560px;margin:0 auto;padding:16px 16px 96px}
main:focus{outline:none}
h1{margin:0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
.tabs{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;z-index:5;display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs button{background:none;border:0;padding:9px 4px 11px;font-size:12px;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
.tabs button svg{width:23px;height:23px}
.tabs button[aria-current="page"]{color:var(--brand);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px}
.hero{position:relative;overflow:hidden;background:var(--brand);color:#fff;border:0;border-radius:20px;padding:22px 20px}
.hero:before{content:"";position:absolute;right:-34px;top:-34px;width:130px;height:130px;border-radius:50%;background:rgba(220,237,226,.12)}
.hero:after{content:"";position:absolute;right:26px;top:0;width:9px;height:26px;border-radius:0 0 6px 6px;background:var(--accent)}
.hero>*{position:relative}
.hero .label{opacity:.85;font-size:14px;font-weight:500}
.hero .big{font-size:38px;font-weight:700;line-height:1.1;margin:6px 0;letter-spacing:-.5px}
.hero .big::first-letter{text-transform:uppercase}
.hero .sub{opacity:.92;font-size:15px}
h2{font-size:18px;font-weight:700;margin:0 0 10px;letter-spacing:-.2px}
h3{font-size:16px;font-weight:600;margin:0 0 6px}
p{margin:0 0 10px}
.muted{color:var(--muted);font-size:14px}
.row{display:flex;gap:10px;align-items:center}
.row>*{flex:1}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px 16px;background:var(--brand);color:#fff;font-weight:600;cursor:pointer;text-align:center;font-size:16px}
.btn:hover{filter:brightness(1.08)}
.btn.alt{background:var(--soft);color:var(--brand)}
.btn.ghost{background:transparent;color:var(--brand);border:1px solid var(--line)}
.btn.warn{background:var(--accent);color:var(--ink)}
.btn.danger{background:#fff;color:var(--danger);border:1px solid #efd3c9}
.btn+.btn{margin-top:10px}
.btn.sm{display:inline-block;width:auto;padding:12px 14px;min-height:44px;font-size:14px}
a.btn{text-decoration:none}
label{display:block;font-size:14px;color:var(--muted);margin:10px 0 4px}
input,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);font-size:16px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.seg button{border:1px solid var(--line);background:#fff;border-radius:14px;padding:10px;cursor:pointer;text-align:left;color:var(--ink)}
.seg button[aria-pressed="true"]{border-color:var(--brand);background:var(--soft)}
.seg b{display:block}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--soft);border-radius:14px;padding:12px}
.stat b{display:block;font-family:var(--fh);font-size:20px;font-weight:700}
.stat b::first-letter{text-transform:uppercase}
.stat span{font-size:13px;color:var(--muted)}
.bar{height:12px;background:var(--soft);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand);border-radius:99px}
.item{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.item .t{font-weight:600}
.item .r{text-align:right;white-space:nowrap}
.pill{display:inline-block;font-size:12px;padding:2px 9px;border-radius:99px;background:var(--soft);color:var(--brand);font-weight:600}
.pill.gold{background:var(--warn);color:var(--warnink)}
.pill.red{background:var(--warn);color:var(--danger)}
.alert{background:var(--warn);border-radius:14px;padding:12px;margin-bottom:12px;font-size:14px;color:var(--warnink)}
.alert.red{background:var(--warn)}
.cal{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;align-items:end;height:120px;margin:8px 0 4px}
.cal div{background:var(--brand);border-radius:5px 5px 0 0;min-height:2px}
.cal-l{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;font-size:11px;color:var(--muted);text-align:center}
.check{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.check:first-of-type{border-top:0}
.check>input[type=checkbox]{width:22px;height:22px;flex:none;margin-top:1px;accent-color:var(--brand)}
.check.done span{text-decoration:line-through;color:var(--muted)}
.timeline{list-style:none;margin:0;padding:0}
.timeline li{position:relative;padding:0 0 14px 22px}
.timeline li:before{content:"";position:absolute;left:5px;top:6px;width:9px;height:9px;border-radius:50%;background:var(--brand)}
.timeline li:after{content:"";position:absolute;left:9px;top:18px;bottom:0;width:1px;background:var(--line)}
.timeline li:last-child:after{display:none}
details{border-top:1px solid var(--line)}
details:first-of-type{border-top:0}
summary{cursor:pointer;font-weight:600;padding:11px 0}
details p{margin:0 0 12px;font-size:15px}
.q{border:0}
.q>summary{display:inline-flex;align-items:center;min-height:44px;padding:0;font-size:14px;color:var(--brand);text-decoration:underline dotted;text-underline-offset:3px;list-style:none}
.q>summary::-webkit-details-marker{display:none}
.q p,.q .box{margin:0 0 10px;font-size:15px;background:var(--soft);border-radius:12px;padding:10px 12px;color:var(--ink)}
.link{background:none;border:0;padding:0 4px;min-height:44px;color:var(--brand);font-weight:600;text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:15px}
.echo{margin:6px 0 0;font-size:14px;color:var(--brand);font-weight:600}
.echo:empty,.err:empty{display:none}
.err{color:var(--danger);font-size:14px;font-weight:600;margin:10px 0 0}
.note-ok{background:var(--soft);color:var(--brand);border-radius:14px;padding:12px;font-size:14px;margin-bottom:12px}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:16px;padding:14px 16px;margin-bottom:10px;cursor:pointer;color:var(--ink);font-size:15px}
.opt b{display:block;font-size:16px;margin-bottom:2px}
.opt span{color:var(--muted);font-size:14px}
.opt:hover{border-color:var(--brand)}
.ttl{font-family:var(--fh);font-size:22px;font-weight:700;margin:0 0 12px;letter-spacing:-.3px}
.glos dt{font-weight:700;margin-top:14px}
.glos dt:first-child{margin-top:0}
.glos dd{margin:2px 0 0;font-size:15px}
.toast{position:fixed;left:50%;bottom:calc(78px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:6;width:max-content;max-width:min(528px,calc(100% - 24px));display:flex;align-items:center;gap:12px;background:var(--ink);color:#fff;border-radius:14px;padding:10px 10px 10px 16px;font-size:15px;box-shadow:0 8px 24px rgba(39,53,47,.28);animation:rise .32s cubic-bezier(.16,1,.3,1)}
.toast:empty{display:none}
.toast button{flex:none;background:none;border:0;color:var(--accent);font-weight:700;min-height:44px;padding:0 8px;cursor:pointer}
@keyframes rise{from{opacity:0;transform:translate(-50%,10px)}}
dialog{border:0;border-radius:20px;padding:0;width:min(520px,calc(100% - 24px));max-height:calc(100% - 24px);background:var(--bg);color:var(--ink)}
dialog::backdrop{background:rgba(39,53,47,.55)}
.dlg{padding:18px}
.dlg h2{margin-bottom:4px}
.dlg h2:focus{outline:none}
.dlg h3{margin:16px 0 8px;font-size:14px;color:var(--muted);font-weight:600}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:6px 4px;border-top:1px solid var(--line);text-align:left;vertical-align:top}
td input{padding:6px;font-size:14px}
.empty{text-align:center;padding:26px 16px}
.empty .big{font-size:26px;font-weight:700;margin-bottom:6px;color:var(--brand)}
.foot{font-size:12px;color:var(--muted);text-align:center;margin-top:18px}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;border:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.cm-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cm-h h1{margin:0;font-size:18px;font-weight:700;letter-spacing:-.2px}.cm-h h1::first-letter{text-transform:uppercase}
.cm-h button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--brand);cursor:pointer;display:grid;place-items:center}
.cm-h svg{width:20px;height:20px}
.cm-h button:disabled{opacity:.35;cursor:default}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cg .w{font-size:11px;color:var(--muted);text-align:center;padding:2px 0}
.cg .d{aspect-ratio:1;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:14px;position:relative;background:#faf8f3}
.cg .d.o{background:none}
.cg .d.has:after{content:"";width:5px;height:5px;border-radius:50%;background:var(--brand);position:absolute;bottom:5px}
.cg .d.imp{background:var(--accent);color:var(--ink);font-weight:700}
.cg .d.imp:after{background:var(--ink)}
.cg .d.today{outline:2px solid var(--brand);outline-offset:-2px}
.cg .d.past{color:var(--muted);opacity:.55}
.lg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.lg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.imp-l{list-style:none;margin:0;padding:0}
.imp-l li{padding:10px 12px;border-radius:12px;background:var(--warn);color:var(--warnink);margin-bottom:8px;font-size:15px}
.klist button{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:10px 0;color:var(--ink);cursor:pointer;font-size:15px}
.klist button:first-of-type{border-top:0}
.iconbtn .lbl{display:none}
.cols>div{min-width:0}
.tabs [hidden]{display:none}
@media (max-width:1023px){.tabs.six{grid-template-columns:repeat(6,1fr)}.tabs.six button{font-size:11px;padding-left:2px;padding-right:2px}}
.chips{border:0;padding:0;margin:12px 0 0;min-width:0}
.chips legend{padding:0;font-size:14px;color:var(--muted);margin-bottom:6px}
.chip{display:inline-block;position:relative;margin:0 6px 8px 0}
.chip span{display:inline-flex;align-items:center;min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:99px;background:#fff;color:var(--ink);font-size:15px;cursor:pointer}
.chip input:checked+span{background:var(--soft);border-color:var(--brand);color:var(--brand);font-weight:600}
.chip input:focus-visible+span{outline:2px solid var(--brand);outline-offset:1px}
.x{width:44px;height:44px;border:0;border-radius:12px;background:none;color:var(--muted);font-size:22px;line-height:1;cursor:pointer}
.x:hover{background:var(--bg);color:var(--danger)}
.item .r:has(>.x){display:flex;align-items:center;gap:2px}

/* Tablet y compu: más ancho y dos columnas. Abajo de 768 queda igual que en el celular. */
@media (min-width:768px){
  main{max-width:1040px;padding:24px 24px 104px}
  .tabs{max-width:none}
  .cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 20px;align-items:start}
  .cols.side{grid-template-columns:minmax(0,5fr) minmax(0,8fr)}
  .solo,.empty{max-width:600px;margin-left:auto;margin-right:auto}
  .cal{height:150px}
  .item .r:has(>.btn){display:flex;align-items:center;gap:12px}
}
/* Compu: barra lateral fija en vez de la barra de abajo. */
@media (min-width:1024px){
  body{padding-left:240px}
  main{padding:32px 40px 56px}
  .top{position:fixed;top:0;bottom:0;left:0;width:240px;flex-direction:column;align-items:stretch;padding:24px 16px 20px;border:0;border-right:1px solid var(--line);background:#fff}
  .brand{padding:0 8px;font-size:20px}
  .tabs{top:96px;bottom:auto;right:auto;width:240px;margin:0;display:flex;flex-direction:column;gap:4px;padding:0 16px;background:none;border:0}
  .tabs button,.iconbtn{flex-direction:row;justify-content:flex-start;align-items:center;gap:12px;width:100%;min-height:44px;padding:10px 12px;border-radius:12px;font-size:15px;color:var(--muted);transition:background-color .15s,color .15s}
  .tabs button svg,.iconbtn svg{width:20px;height:20px;flex:none}
  .tabs button:hover,.iconbtn:hover{background:var(--bg);color:var(--ink)}
  .tabs button[aria-current="page"]{background:var(--soft);color:var(--brand)}
  .iconbtn{display:flex}
  .iconbtn .lbl{display:inline}
  .cols.side>div:first-child{position:sticky;top:32px}
  .hero .big{font-size:44px}
  .toast{bottom:28px;left:calc(50% + 120px)}
}
@media (min-width:1280px){td .pill{white-space:nowrap}}
</style>

</head>

  <div class="brand"><svg class="logo" viewBox="0 0 40 40" aria-hidden="true"><rect x="2" y="5" width="36" height="33" rx="9" fill="#245B48"/><rect x="11" y="1" width="4.5" height="9" rx="2.25" fill="#E9A27E"/><rect x="24.5" y="1" width="4.5" height="9" rx="2.25" fill="#E9A27E"/><rect x="8" y="16" width="24" height="17" rx="5" fill="#F7F5EF"/><path d="M14.5 25.2l4 4 7.5-8.2" fill="none" stroke="#245B48" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>Fecha Libre</div>

<script>
"use strict";
/* ---------- Estado (solo en este dispositivo) ---------- */
const KEY = "fechalibre.ar.v1";
const blank = () => ({currency:"ARS", budget:0, income:0, gastos:0, strategy:"avalancha", deudas:[], cuotas:[], history:[], checks:{}, movs:[]});
// Modo Ahorro: categorías de gastos del día a día (las deudas y cuotas ya están en el plan).
const CATS = {super:"Súper", delivery:"Comida afuera", salidas:"Salidas", transporte:"Transporte", subs:"Suscripciones", ropa:"Ropa y compras", otros:"Otros"};
const isCat = c => Object.prototype.hasOwnProperty.call(CATS, c);
let S = load();
let tab = "inicio";
let calM = 0;
// shortcut: el Modo Ahorro se activa con el link que recibe quien lo compra; sin login ese link se puede compartir. Con login (Supabase) pasa a la cuenta.
const ahorroOn = () => { try { return localStorage.getItem(KEY + ".ahorro") === "1"; } catch(e){ return false; } };
try { const u = JSON.parse(localStorage.getItem(KEY + ".ui")); if (["inicio","deudas","cuotas","calendario","plan"].concat(ahorroOn() ? ["ahorro"] : []).includes(u.tab)) tab = u.tab; if (u.calM > 0 && u.calM < 600) calM = u.calM | 0; } catch(e){}
let recienActivado = false;
if (new URLSearchParams(location.search).get("ahorro") === "fl7k2q") {
  try { localStorage.setItem(KEY + ".ahorro", "1"); recienActivado = true; tab = "ahorro"; } catch(e){}
  history.replaceState(null, "", location.pathname);
}
/* Sanea el estado (copia importada o localStorage): fuerza tipos y ids seguros */
function sane(s){
  const n = v => Number.isFinite(+v) && v !== "" && v !== null ? +v : 0, str = (v, m) => String(v ?? "").slice(0, m);
  const id = v => String(v ?? "").replace(/[^A-Za-z0-9_-]/g, "").slice(0, 40) || Math.random().toString(36).slice(2, 9);
  const obj = x => x && typeof x === "object" && !Array.isArray(x);
  s.currency = /^[A-Z]{3}$/.test(s.currency) ? s.currency : "ARS";
  s.strategy = s.strategy === "bola" ? "bola" : "avalancha";
  s.budget = n(s.budget); s.income = n(s.income); s.gastos = n(s.gastos);
  s.deudas = (Array.isArray(s.deudas) ? s.deudas : []).filter(obj).map(x => ({id:id(x.id), name:str(x.name, 80), balance:n(x.balance), rate:n(x.rate), min:n(x.min), due:n(x.due), rateUnknown:!!x.rateUnknown, minEst:!!x.minEst}));

// Un solo punto con 2 decimales («95.5», «66.67») se toma como decimal.
function num(v){
  let s = String(v ?? "").replace(/[^\d.,]/g, "");
  if (!s) return 0;
  const dots = (s.match(/\./g) || []).length, commas = (s.match(/,/g) || []).length;
  if (dots && commas) s = s.lastIndexOf(",") > s.lastIndexOf(".") ? s.replace(/\./g, "").replace(",", ".") : s.replace(/,/g, "");
  else if (commas) s = commas > 1 ? s.replace(/,/g, "") : s.replace(",", ".");
  else if (dots > 1 || /\.\d{3}$/.test(s)) s = s.replace(/\./g, "");
  const n = parseFloat(s);
  return isFinite(n) && n > 0 ? n : 0;
}

/* ---------- Motor del plan: mes a mes ----------
   Cuotas = pago fijo que se descuenta del presupuesto. Cuando una termina, ese dinero
   pasa solo a la deuda objetivo (Efecto Cuota Liberada). Deudas con interés: se paga el
   mínimo de todas y el resto va a la objetivo (avalancha = mayor tasa, bola = menor saldo). */
function simulate(strategy, onlyMin){
  const D = activeDeudas().map(d => ({id:d.id, name:d.name, bal:d.balance, r:(d.rate || 0) / 1200, min:d.min || 0}));
  const C = activeCuotas().map(c => ({id:c.id, name:c.desc, amt:c.amount, left:c.left}));
  const budget = S.budget || 0;
  let m = 0, interest = 0, first = null;
  const events = [];
  while (m < 600) {
    const aD = D.filter(d => d.bal > 0.009), aC = C.filter(c => c.left > 0);
    if (!aD.length && !aC.length) break;
    const pay = {};
    let fixed = 0;
    aC.forEach(c => { fixed += c.amt; pay[c.id] = c.amt; c.left--; if (!c.left) events.push({m, type:"cuota", id:c.id, name:c.name, amt:c.amt}); });
    aD.forEach(d => { const i = d.bal * d.r; d.bal += i; interest += i; });
    let pool = budget - fixed;
    aD.forEach(d => { const p = Math.min(d.bal, d.min); d.bal -= p; pay[d.id] = p; pool -= p; });
    let target = null;
    if (!onlyMin && pool > 0.009) {
      const order = aD.filter(d => d.bal > 0.009).sort(strategy === "bola" ? (a, b) => a.bal - b.bal : (a, b) => b.r - a.r || a.bal - b.bal);
      for (const d of order) { if (pool <= 0.009) break; if (!target) target = d.id; const p = Math.min(pool, d.bal); d.bal -= p; pool -= p; pay[d.id] += p; }
    }
    aD.forEach(d => { if (d.bal <= 0.009) { d.bal = 0; events.push({m, type:"deuda", id:d.id, name:d.name}); } });
    if (m === 0) first = {pay, fixed, target, balances:Object.fromEntries(D.map(d => [d.id, r2(d.bal)]))};
    m++;
  }
  const done = !D.some(d => d.bal > 0.009) && !C.some(c => c.left > 0);
  return {months:m, done, interest, events, first};
}
function plan(){
  if (!activeDeudas().length && !activeCuotas().length) return {status:"vacio"};
  const need = minimoNecesario();
  if (activeDeudas().length && (!S.budget || S.budget + 0.009 < need)) return {status:"presupuesto", need};
  const sim = simulate(S.strategy, false);
  return {status:"ok", need, sim};
}

/* ---------- Acelerador: cuánto adelantás sumando un extra por mes ---------- */
function acelerador(sim){
  if (!sim || !sim.done || !activeDeudas().length) return "";
  const base = S.budget;
  const rows = [0.1, 0.25, 0.5].map(p => {
    const extra = Math.ceil(base * p / 1000) * 1000;
    S.budget = base + extra; const s = simulate(S.strategy, false); S.budget = base;
    return {extra, s};
  }).filter((r, i, all) => r.s.done && r.s.months < sim.months && !all.slice(0, i).some(p => p.s.months === r.s.months));
  S.budget = base;

    <p class="muted">Si sumás un extra por mes (aguinaldo, horas extra, una venta, una suscripción menos), adelantás tu fecha libre:</p>

}


/* ---------- Calendario: vencimientos y fechas importantes del plan ---------- */
function calItems(m, sim){
  const clear = {};
  if (sim) sim.events.forEach(e => { if (e.type === "deuda") clear[e.id] = e.m; });
  const out = [];
  // k = qué se paga ese día: las cuotas van dentro del resumen de su tarjeta.
  activeCuotas().forEach(c => { if (m < c.left) out.push({day:c.due || 0, t:c.desc, k:c.card || c.desc, amt:c.amount, imp: m === c.left - 1 ? "cuota" : ""}); });
  activeDeudas().forEach(d => { const e = clear[d.id]; if (e === undefined || m <= e) out.push({day:d.due || 0, t:d.name, k:d.name, amt:d.min, imp: e === m ? "deuda" : "", min:true}); });
  return out;
}
const ymd = d => `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, "0")}${String(d.getDate()).padStart(2, "0")}`;

/* ---------- Calendario → Google Calendar: un evento mensual por tarjeta o deuda (un toque y «Guardar») ---------- */
function gcalLinks(){
  const P = plan(), sim = P.status === "ok" ? P.sim : null, n = sim && sim.done ? sim.months : 12;
  const g = new Map();
  for (let m = 0; m < n; m++) calItems(m, sim).forEach(i => {
    if (!i.day) return;
    // Del PDF salen «Tarjeta Visa» (saldo) y «Visa» (cuotas): mismo resumen, un solo aviso con el nombre de la deuda.
    const id = i.k.replace(/^tarjeta\s+/i, "").toLowerCase() + "|" + i.day, e = g.get(id) || {k:i.k, day:i.day, n:0};
    if (i.min) e.k = i.k;
    e.n = m + 1; g.set(id, e);
  });
  const key = ym(off()), y = +key.slice(0, 4), mo = +key.slice(5, 7) - 1;
  return [...g.values()].sort((a, b) => a.day - b.day).map(e => {
    // shortcut: del 29 al 31 se agenda el 28 (avisa antes, nunca tarde) porque un evento mensual el 31 se saltea los meses cortos.
    const d = Math.min(e.day, 28), start = new Date(y, mo, d);
    const q = {action:"TEMPLATE", text:`Pagar ${e.k} · Fecha Libre`, dates:`${ymd(start)}/${ymd(new Date(y, mo, d + 1))}`,
      details:`Mirá cuánto te toca pagar este mes en Fecha Libre: ${location.origin}${location.pathname}` + (e.day > 28 ? `\nVence el día ${e.day}: lo anotamos el 28 para que no se saltee en los meses cortos.` : "")};
    if (e.n > 1) q.recur = `RRULE:FREQ=MONTHLY;COUNT=${e.n}`;
    return {...e, url:"https://calendar.google.com/calendar/render?" + new URLSearchParams(q)};
  });
}

/* ---------- Calendario → archivo .ics (el calendario del celular avisa; la app no manda nada) ---------- */
const icsEsc = s => String(s).replace(/[\\;,]/g, "\\$&").replace(/\n/g, "\\n");
function descargarIcs(){
  const P = plan(), sim = P.status === "ok" ? P.sim : null, n = sim ? sim.months : 12;
  const stamp = new Date().toISOString().replace(/[-:]|\.\d+/g, ""), f = ymd;
  const ev = [];
  const add = (key, day, title, desc) => {
    const y = +key.slice(0, 4), mo = +key.slice(5, 7) - 1, dd = Math.min(day, new Date(y, mo + 1, 0).getDate());
    ev.push(["BEGIN:VEVENT", `UID:${uid()}${ev.length}@fechalibre`, `DTSTAMP:${stamp}`, `DTSTART;VALUE=DATE:${f(new Date(y, mo, dd))}`, `DTEND;VALUE=DATE:${f(new Date(y, mo, dd + 1))}`,
      `SUMMARY:${icsEsc(title)}`, `DESCRIPTION:${icsEsc(desc)}`, "BEGIN:VALARM", "ACTION:DISPLAY", `DESCRIPTION:${icsEsc(title)}`, "TRIGGER:-PT15H", "END:VALARM", "END:VEVENT"].join("\r\n"));
  };
  for (let m = 0; m < n; m++) {
    const key = ym(off() + m), items = calItems(m, sim);
    items.filter(i => i.day).forEach(i => add(key, i.day,
      `${i.imp === "cuota" ? "Última cuota de " : i.imp === "deuda" ? "Terminás de pagar " : i.min ? "Pagá el mínimo de " : "Pagá la cuota de "}${i.t} (${fmt(i.amt)})`,
      "Fecha Libre. Las fechas del plan son estimaciones."));
    if (sim && sim.done && m === sim.months - 1) {
      const ds = items.filter(i => i.imp && i.day).map(i => i.day);
      add(key, ds.length ? Math.max(...ds) : 31, "Tu Fecha Libre", "Según tu plan, este mes terminás de pagar todo. Es una estimación.");
    }
  }
  if (!ev.length) return;
  const a = document.createElement("a");
  // RFC 5545: líneas de máx. 75 octetos; se pliegan con CRLF + espacio (corte por caracteres, sin partir UTF-8)
  const fold = l => { const enc = new TextEncoder(); let out = "", cur = "", n = 0; for (const ch of l) { const b = enc.encode(ch).length; if (n + b > (out ? 74 : 75)) { out += (out ? "\r\n " : "") + cur; cur = ""; n = 0; } cur += ch; n += b; } return out + (out ? "\r\n " : "") + cur; };
  const body = ("BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Fecha Libre//ES\r\nCALSCALE:GREGORIAN\r\n" + ev.join("\r\n") + "\r\nEND:VCALENDAR\r\n").split("\r\n").map(fold).join("\r\n");
  a.href = URL.createObjectURL(new Blob([body], {type:"text/calendar"}));
  a.download = "fecha-libre-calendario.ics";
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

  const keys = sim ? sim.events.slice(0, 8) : [], gl = gcalLinks();

/* ---------- Modo Ahorro (extra pago): anotar gastos y ver de dónde sacar plata para salir antes ---------- */
const isoLocal = d => ymd(d).replace(/(\d{4})(\d\d)(\d\d)/, "$1-$2-$3");
let movUndo = null, budgetUndo = 0;
// Las 3 categorías donde más gastaste en 30 días: cuánto adelantás si gastás la mitad y lo sumás al pago.
function ideasAhorro(){
  const desde = isoLocal(new Date(Date.now() - 29 * 864e5)), t = {};
  S.movs.forEach(m => { if (m.d >= desde) t[m.cat] = (t[m.cat] || 0) + m.amt; });
  const P = plan(), base = P.status === "ok" && P.sim.done && activeDeudas().length ? P.sim : null;
  return Object.entries(t).filter(([c, v]) => c !== "otros" && v >= 2000).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([cat, total]) => {
    const half = Math.round(total / 2000) * 1000;
    let s = null;
    if (base) { const b0 = S.budget; S.budget = b0 + half; s = simulate(S.strategy, false); S.budget = b0; }
    return {cat, total, half, s, base};
  });
}
function vAhorro(){
  const hoy = isoLocal(new Date()), ayer = isoLocal(new Date(Date.now() - 864e5)), mes = hoy.slice(0, 7);
  const delMes = S.movs.filter(m => m.d.slice(0, 7) === mes).sort((a, b) => b.d.localeCompare(a.d));
  const tot = delMes.reduce((a, m) => a + m.amt, 0), mesTxt = new Intl.DateTimeFormat("es-AR", {month:"long"}).format(new Date());
  const last = S.movs.length ? S.movs[S.movs.length - 1].cat : "super", hasD = activeDeudas().length > 0;
  const form = `<form id="fGasto" class="card" novalidate><h1 class="ttl">Anotá un gasto</h1>
    <label for="gAmt" style="margin-top:0">¿Cuánto gastaste?</label>

    <p class="echo" id="gAmt-echo"></p>
    <fieldset class="chips"><legend>¿En qué?</legend>${Object.entries(CATS).map(([k, v]) => `<label class="chip"><input type="radio" name="cat" value="${k}" class="sr"${k === last ? " checked" : ""}><span>${v}</span></label>`).join("")}</fieldset>
    <p class="err" role="alert"></p><button class="btn" style="margin-top:8px">Anotar</button>
    <p class="muted" style="margin:10px 0 0">Las deudas y cuotas no van acá: ya están en tu plan.</p></form>`;
  const hero = `<div class="card hero"><div class="label">En ${esc(mesTxt)} gastaste</div><p class="big">${fmt(tot)}</p>
    <div class="sub">${delMes.length ? `En ${delMes.length} ${delMes.length === 1 ? "gasto anotado" : "gastos anotados"}.` : "Todavía no anotaste nada este mes."}</div></div>`;
  const ideas = ideasAhorro();
  const idea = i => {
    const s = i.s, b = i.base;
    const res = s && s.done && s.months < b.months ? `salís <b>${b.months - s.months} ${b.months - s.months === 1 ? "mes" : "meses"} antes</b>: en ${esc(fechaTxt(s))}`
      : s && s.done && b.interest - s.interest >= 1000 ? `te ahorrás unos <b>${fmt(b.interest - s.interest)}</b> de intereses`

    return `<div class="item" style="display:block"><p style="margin:0"><b>${CATS[i.cat]}</b>: ${fmt(i.total)} en 30 días. Si gastás la mitad, ${res}.</p>
      ${hasD ? `<button class="btn sm alt" data-action="ahorro-sumar" data-v="${i.half}" style="margin-top:8px">Sumar ${fmt(i.half)} a lo que pago por mes</button>` : ""}</div>`;
  };
  const hook = `<div class="card"><h2>De dónde sacar plata para salir antes</h2>${ideas.length
    ? `<p class="muted">Mirando lo que anotaste en los últimos 30 días:</p>${ideas.map(idea).join("")}${hasD ? "" : `<p class="muted" style="margin:10px 0 0">Tus cuotas son fijas: lo que ahorres te queda libre para lo que quieras.</p>`}`
    : `<p class="muted" style="margin:0">Anotá tus gastos unos días. Acá te mostramos en qué se te va más plata y cuántos meses antes salís si lo recortás.</p>`}</div>`;
  const byCat = Object.entries(delMes.reduce((a, m) => (a[m.cat] = (a[m.cat] || 0) + m.amt, a), {})).sort((a, b) => b[1] - a[1]);
  const max = byCat.length ? byCat[0][1] : 1;
  const cats = byCat.length ? `<div class="card"><h2>En qué se fue</h2>${byCat.map(([c, v]) => `<div class="item" style="display:block"><div class="between"><span class="t">${CATS[c]}</span><span style="white-space:nowrap">${fmt(v)} <span class="muted">· ${Math.round(v / tot * 100)} %</span></span></div>
    <div class="bar" style="height:8px;margin-top:8px" aria-hidden="true"><i style="width:${v / max * 100}%"></i></div></div>`).join("")}</div>` : "";
  const dia = d => d === hoy ? "Hoy" : d === ayer ? "Ayer" : "El " + +d.slice(8);
  const list = delMes.length ? `<div class="card"><h2>Tus gastos de ${esc(mesTxt)}</h2>${delMes.map(m => `<div class="item"><div><div class="t">${CATS[m.cat]}</div><div class="muted">${dia(m.d)}</div></div>
    <div class="r">${fmt(m.amt)}<button class="x" data-action="del-mov" data-id="${m.id}" aria-label="Borrar ${fmt(m.amt)} de ${CATS[m.cat]}">×</button></div></div>`).join("")}</div>` : "";
  return cols(form + hero, hook + cats + list);
}

let pdfjs = null;
function loadPdfJs(){
  if (pdfjs) return Promise.resolve(pdfjs);
  return new Promise((ok, fail) => {
    const s = document.createElement("script");
    s.src = "vendor/pdf.min.js";
    s.onload = () => { pdfjs = window.pdfjsLib; pdfjs.GlobalWorkerOptions.workerSrc = "vendor/pdf.worker.min.js"; ok(pdfjs); };
    s.onerror = () => fail(new Error("lector de PDF"));
    document.head.appendChild(s);
  });
}
async function pdfLines(data){
  const lib = await loadPdfJs();
  const task = lib.getDocument({data, isEvalSupported:false});
  task.onPassword = (update, reason) => {
    passCb = {update, task};
    openDlg(`<form id="fPass"><h2>${reason === 2 ? "Contraseña incorrecta" : "Tu PDF tiene contraseña"}</h2>
      <p class="muted">Muchos bancos usan tu DNI. La contraseña se usa solo acá, en tu dispositivo.</p>
      <label for="pw">Contraseña</label><input id="pw" name="pw" type="password" autocomplete="off" required autofocus>
      <div style="margin-top:14px"><button class="btn" type="submit">Abrir</button><button class="btn ghost" type="button" data-action="close">Cancelar</button></div></form>`);
  };
  const doc = await task.promise, lines = [];
  for (let p = 1; p <= doc.numPages; p++) {
    const page = await doc.getPage(p), tc = await page.getTextContent(), rows = [];
    tc.items.forEach(it => {
      if (!it.str || !it.str.trim()) return;
      const y = it.transform[5], x = it.transform[4];
      let row = rows.find(r => Math.abs(r.y - y) < 3);
      if (!row) rows.push(row = {y, parts:[]});
      row.parts.push({x, s:it.str});
    });
    rows.sort((a, b) => b.y - a.y).forEach(r => lines.push(r.parts.sort((a, b) => a.x - b.x).map(q => q.s).join(" ").replace(/\s+/g, " ").trim()));
  }
  return lines;
}

function parseAmount(s){
  s = s.replace(/\s/g, "");
  const neg = s.startsWith("-"); s = s.replace("-", "");
  const dec = s.slice(-3, -2);
  const intPart = s.slice(0, -3).replace(/[.,]/g, ""), cents = s.slice(-2);
  const n = parseFloat(intPart + "." + cents);

}
async function handlePdf(file){

  if (file.type !== "application/pdf" && !/\.pdf$/i.test(file.name)) return err("Ese archivo no es un PDF", "Elegí el resumen en PDF que te manda tu banco.");
  if (file.size > 20e6) return err("El archivo es demasiado grande", "Descargá el resumen desde la app o la web de tu banco y probá de nuevo.");
  openDlg(`<h2>Leyendo tu resumen…</h2><p class="muted">Se lee en ${TU}. Nada sale de acá.</p>`);
  pdfCancelled = false;
  try {
    const lines = await pdfLines(new Uint8Array(await file.arrayBuffer()));
    if (!lines.length) return err("Parece una foto o un escaneo", "No podemos leer este PDF. Descargá el resumen desde la app de tu banco (no le saques foto) o cargá tus cuotas a mano.");
    const r = parseStatement(lines);
    if (!r.cuotas.length && !r.saldo) return err("No parece un resumen de tarjeta", "No encontramos cuotas ni lo que debés. Probá con el PDF del resumen de la tarjeta o cargalo a mano.");
    reviewImport(r);
  } catch(e) {
    if (pdfCancelled) return;
    const n = e && e.name, m = e && e.message || "";
    if (n === "InvalidPDFException") err("No pudimos abrir ese PDF", "Está dañado o no es un resumen. Descargalo de nuevo desde tu banco.");
    else if (/lector de PDF/.test(m)) err("No pudimos abrir el resumen", "Revisá que tengas internet y probá de nuevo.");
    else err("No pudimos abrir el archivo", "Probá de nuevo o cargá tus cuotas a mano.");
  }
}

function saveImport(form){

    if (!amount) return;

      budgetUndo = S.budget; S.budget = r2(S.budget + (+t.dataset.v || 0)); save(); render();
      const Q = plan();
      toast(`Ahora pagás ${fmt(S.budget)} por mes.${Q.status === "ok" && Q.sim.done ? ` Terminás en ${esc(fechaTxt(Q.sim))}.` : ""}`, "ahorro-undo", "Deshacer"); break;
    }
    case "ahorro-undo": S.budget = budgetUndo; save(); render(); toast(`Volviste a ${fmt(S.budget)} por mes.`); break;
    case "close": dlg.close(); break;
  }
}
document.addEventListener("click", e => {
  const t = e.target.closest("[data-tab],[data-tab-go],[data-action]");
  if (!t) return;
  if (t.closest("#toast")) document.getElementById("toast").innerHTML = "";
  if (t.dataset.tab || t.dataset.tabGo) { tab = t.dataset.tab || t.dataset.tabGo; if (dlg.open) dlg.close(); render(); window.scrollTo(0, 0); return; }
  const action = t.dataset.action;
  if (S.demo && LOADERS.has(action))
    return confirmDlg("¿Empezamos con lo tuyo?", "Borramos el ejemplo para que cargues tus deudas y cuotas.", "Sí, borrar el ejemplo", () => { clearDemo(); render(); run(action, t); }, null, true);
  run(action, t);
});
// Mientras escribís un monto, te mostramos cómo lo entendimos («= $ 200.000»).
document.addEventListener("input", e => {
  const t = e.target; if (!t.hasAttribute || !t.hasAttribute("data-money")) return;
  const out = document.getElementById(t.id + "-echo"); if (!out) return;
  const v = t.value.trim();
  out.textContent = !v ? "" : num(v) ? "= " + fmt(num(v)) : "No entendimos el número. Escribilo así: 200.000";
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.check) { S.checks[t.dataset.check] = t.checked; save(); t.closest(".check").classList.toggle("done", t.checked); return; }
  // setTimeout: si tocaste otro campo, el foco ya pasó ahí y render() lo conserva.
  if (t.dataset.change === "budget") { S.budget = num(t.value); budgetOpen = true; save(); setTimeout(render); }
  if (t.dataset.change === "income" || t.dataset.change === "gastos") { S[t.dataset.change] = num(t.value); calcOpen = true; save(); setTimeout(render); }
  if (t.id === "pdfInput") { handlePdf(t.files[0]); t.value = ""; }
  if (t.id === "jsonInput" && t.files[0]) {
    t.files[0].text().then(txt => {
      const d = JSON.parse(txt);
      if (!Array.isArray(d.deudas) || !Array.isArray(d.cuotas)) throw new Error("formato");
      confirmDlg("¿Recuperar tus datos desde la copia?", "Esto reemplaza lo que tenés ahora por lo de la copia.", "Recuperar", () => { S = sane(Object.assign(blank(), d)); save(); tab = "inicio"; render(); toast("Listo, recuperamos tus datos."); }, settings, true);
    }).catch(() => openDlg(`<h2>Ese archivo no sirve</h2><p class="muted">No es una copia de Fecha Libre. Buscá el archivo que empieza con «fecha-libre».</p><button class="btn" type="button" data-action="close">Entendido</button>`)).finally(() => { t.value = ""; });
  }
});
const formErr = (f, msg) => { const p = f.querySelector(".err"); if (p) p.textContent = msg; };
document.addEventListener("submit", e => {
  e.preventDefault();
  const f = e.target, fd = new FormData(f), id = f.dataset.id;
  if (f.id === "fDeuda") {
    const balance = num(fd.get("balance")), rateRaw = (fd.get("rate") || "").trim(), minRaw = num(fd.get("min"));
    if (!balance) return formErr(f, "Poné cuánto debés hoy. Por ejemplo: 350.000");
    const d = {name:(fd.get("name") || "").trim() || "Deuda", balance, rate:num(rateRaw), rateUnknown:!rateRaw, min:minRaw || r2(balance * 0.05), minEst:!minRaw, due:Math.min(31, Math.round(num(fd.get("due"))))};
    if (id) Object.assign(S.deudas.find(x => x.id === id), d); else S.deudas.push(Object.assign({id:uid()}, d));
  } else if (f.id === "fCuota") {
    const amount = num(fd.get("amount")), cur = Math.round(num(fd.get("cur"))), total = Math.round(num(fd.get("total")));
    if (!amount) return formErr(f, "Poné cuánto pagás por mes de esta cuota. Por ejemplo: 45.000");
    if (!cur || !total) return formErr(f, "Completá en qué cuota vas y de cuántas. Si tu resumen dice «cuota 3/12», poné 3 y 12.");
    if (cur > total) return formErr(f, `La cuota en la que vas (${cur}) no puede ser mayor que el total (${total}).`);
    const old = id ? S.cuotas.find(x => x.id === id) : null;
    const c = {desc:(fd.get("desc") || "").trim() || "Compra", card:(fd.get("card") || "").trim(), amount, left:total - cur + 1, total, si:old ? old.si : false, due:Math.min(31, Math.round(num(fd.get("due"))))};
    if (old) Object.assign(old, c); else S.cuotas.push(Object.assign({id:uid()}, c));
  } else if (f.id === "fPass") { const p = passCb; passCb = null; if (p) { openDlg("<h2>Leyendo tu resumen…</h2>"); p.update(fd.get("pw")); } return; }
  else if (f.id === "fImport") { saveImport(f); return; }
  else if (f.id === "fGasto") {
    const amt = num(fd.get("amt")), cat = fd.get("cat");
    if (!amt) return formErr(f, "Poné cuánto gastaste. Por ejemplo: 15.000");
    if (!isCat(cat)) return formErr(f, "Elegí en qué fue el gasto.");
    movUndo = S.movs.slice(); S.movs.push({id:uid(), d:isoLocal(new Date()), amt, cat}); save(); render();
    toast(`Anotado: ${fmt(amt)} en ${CATS[cat]}.`, "undo-mov", "Deshacer"); return;
  }
  else return;
  save(); dlg.close(); render();
  toast(id ? "Cambios guardados." : "Listo, lo sumamos a tu plan.");
});
if (ahorroOn()) { const b = document.querySelector('.tabs [data-tab="ahorro"]'); b.hidden = false; b.parentNode.classList.add("six"); }
render();
if (recienActivado) toast("¡Modo Ahorro activado! Anotá tu primer gasto.");
</script>
