<style>
:root{
  --bg:#F7F5EF; --card:#FFFFFF; --ink:#27352F; --muted:#5E6B64; --line:#E7E3D8;
  --brand:#245B48; --brand2:#245B48; --accent:#E9A27E; --danger:#B4533B; --ok:#245B48;

  --fh:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --fb:"DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--fb);font-variant-numeric:tabular-nums}
button,input,select{font:inherit}
h1,h2,h3,.big,.brand{font-family:var(--fh)}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:var(--bg);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;font-size:19px;font-weight:700;color:var(--brand);letter-spacing:-.2px}
.logo{width:30px;height:30px;flex:none}
.iconbtn{background:transparent;border:0;color:var(--brand);font-size:22px;padding:4px 8px;cursor:pointer}
main{max-width:560px;margin:0 auto;padding:16px 16px 96px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs button{background:none;border:0;padding:9px 4px 11px;font-size:12px;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
.tabs button svg{width:23px;height:23px}
.tabs button[aria-current="page"]{color:var(--brand);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px}
.hero{position:relative;overflow:hidden;background:var(--brand);color:#fff;border:0;border-radius:20px;padding:22px 20px}
.hero:before{content:"";position:absolute;right:-34px;top:-34px;width:130px;height:130px;border-radius:50%;background:rgba(220,237,226,.12)}
.hero:after{content:"";position:absolute;right:26px;top:0;width:9px;height:26px;border-radius:0 0 6px 6px;background:var(--accent)}
.hero>*{position:relative}
.hero .label{opacity:.85;font-size:14px;font-weight:500}
.hero .big{font-size:38px;font-weight:700;line-height:1.1;margin:6px 0;letter-spacing:-.5px}
.hero .big::first-letter{text-transform:uppercase}
.hero .sub{opacity:.92;font-size:15px}
h2{font-size:18px;font-weight:700;margin:0 0 10px;letter-spacing:-.2px}
h3{font-size:16px;font-weight:600;margin:0 0 6px}
p{margin:0 0 10px}
.muted{color:var(--muted);font-size:14px}
.row{display:flex;gap:10px;align-items:center}
.row>*{flex:1}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px 16px;background:var(--brand);color:#fff;font-weight:600;cursor:pointer;text-align:center;font-size:16px}
.btn:hover{filter:brightness(1.08)}
.btn.alt{background:var(--soft);color:var(--brand)}
.btn.ghost{background:transparent;color:var(--brand);border:1px solid var(--line)}
.btn.warn{background:var(--accent);color:var(--ink)}
.btn.danger{background:#fff;color:var(--danger);border:1px solid #efd3c9}
.btn+.btn{margin-top:10px}
.btn.sm{display:inline-block;width:auto;padding:8px 12px;font-size:14px}
label{display:block;font-size:14px;color:var(--muted);margin:10px 0 4px}
input,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);font-size:16px}

.foot{font-size:12px;color:var(--muted);text-align:center;margin-top:18px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

.cm-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cm-h h2{margin:0}.cm-h h2::first-letter{text-transform:uppercase}

.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cg .w{font-size:11px;color:var(--muted);text-align:center;padding:2px 0}
.cg .d{aspect-ratio:1;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:14px;position:relative;background:#faf8f3}
.cg .d.o{background:none}
.cg .d.has:after{content:"";width:5px;height:5px;border-radius:50%;background:var(--brand);position:absolute;bottom:5px}
.cg .d.imp{background:var(--accent);color:var(--ink);font-weight:700}
.cg .d.imp:after{background:var(--ink)}
.cg .d.today{outline:2px solid var(--brand);outline-offset:-2px}
.lg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}

.imp-l{list-style:none;margin:0;padding:0}
.imp-l li{padding:10px 12px;border-radius:12px;background:var(--warn);color:var(--warnink);margin-bottom:8px;font-size:15px}
.klist button{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:10px 0;color:var(--ink);cursor:pointer;font-size:15px}
.klist button:first-of-type{border-top:0}
</style>

<header class="top">
  <div class="brand"><svg class="logo" viewBox="0 0 40 40" aria-hidden="true"><rect x="2" y="5" width="36" height="33" rx="9" fill="#245B48"/><rect x="11" y="1" width="4.5" height="9" rx="2.25" fill="#E9A27E"/><rect x="24.5" y="1" width="4.5" height="9" rx="2.25" fill="#E9A27E"/><rect x="8" y="16" width="24" height="17" rx="5" fill="#F7F5EF"/><path d="M14.5 25.2l4 4 7.5-8.2" fill="none" stroke="#245B48" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>Fecha Libre</div>
  <button class="iconbtn" data-action="settings" aria-label="Ajustes">⚙︎</button>

  <button data-tab="deudas"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="12.5" rx="3"/><path d="M3 10.5h18M7 15h3"/></svg>Deudas</button>
  <button data-tab="cuotas"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17l5-5 3.5 3.5L20 8"/><path d="M15 8h5v5"/></svg>Cuotas</button>
  <button data-tab="calendario"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="3.5"/><path d="M8 3v4M16 3v4M3.5 10h17"/><circle cx="8.5" cy="14.5" r=".9"/><circle cx="12" cy="14.5" r=".9"/><circle cx="15.5" cy="14.5" r=".9"/></svg>Calendario</button>
  <button data-tab="plan"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Plan</button>

<script>
"use strict";
/* ---------- Estado (solo en este dispositivo) ---------- */
const KEY = "fechalibre.ar.v1";
const blank = () => ({currency:"ARS", budget:0, income:0, gastos:0, strategy:"avalancha", deudas:[], cuotas:[], history:[], checks:{}});
let S = load();
let tab = "inicio";
/* Sanea el estado (copia importada o localStorage): fuerza tipos y ids seguros */
function sane(s){
  const n = v => Number.isFinite(+v) && v !== "" && v !== null ? +v : 0, str = (v, m) => String(v ?? "").slice(0, m);
  const id = v => String(v ?? "").replace(/[^A-Za-z0-9_-]/g, "").slice(0, 40) || Math.random().toString(36).slice(2, 9);
  const obj = x => x && typeof x === "object" && !Array.isArray(x);
  s.currency = /^[A-Z]{3}$/.test(s.currency) ? s.currency : "ARS";
  s.strategy = s.strategy === "bola" ? "bola" : "avalancha";
  s.budget = n(s.budget); s.income = n(s.income); s.gastos = n(s.gastos);
  s.deudas = (Array.isArray(s.deudas) ? s.deudas : []).filter(obj).map(x => ({id:id(x.id), name:str(x.name, 80), balance:n(x.balance), rate:n(x.rate), min:n(x.min), due:n(x.due)}));
  s.cuotas = (Array.isArray(s.cuotas) ? s.cuotas : []).filter(obj).map(x => ({id:id(x.id), desc:str(x.desc, 80), card:str(x.card, 60), amount:n(x.amount), left:n(x.left), total:x.total === "" ? "" : n(x.total), si:!!x.si, due:n(x.due)}));
  s.history = (Array.isArray(s.history) ? s.history : []).filter(obj).map(h => ({d:str(h.d, 10), mes:str(h.mes, 7), paid:n(h.paid)}));
  const ck = {}; if (obj(s.checks)) for (const k in s.checks) ck[k] = !!s.checks[k]; s.checks = ck;
  s.demo = !!s.demo;
  return s;
}
function load(){ try { return sane(Object.assign(blank(), JSON.parse(localStorage.getItem(KEY)) || {})); } catch(e){ return blank(); } }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }
const uid = () => Math.random().toString(36).slice(2, 9);
const num = v => { const n = parseFloat(String(v ?? "").replace(",", ".")); return isFinite(n) && n > 0 ? n : 0; };
const r2 = n => Math.round(n * 100) / 100;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const LOCALES = {USD:"es-US",ARS:"es-AR",MXN:"es-MX",CLP:"es-CL",COP:"es-CO",PEN:"es-PE",UYU:"es-UY",EUR:"es-ES",GTQ:"es-GT",DOP:"es-DO",BOB:"es-BO",PYG:"es-PY",CRC:"es-CR"};
function fmt(n){
  const c = S.currency, z = ["ARS","CLP","COP","PYG","UYU","CRC"].includes(c) ? 0 : 2;
  try { return new Intl.NumberFormat(LOCALES[c] || "es", {style:"currency", currency:c, minimumFractionDigits:z, maximumFractionDigits:z}).format(n || 0); }
  catch(e){ return (n || 0).toFixed(z); }
}
// Mes 0 del plan = el primer mes todavía no registrado como pagado (si ya pagaste noviembre, el plan arranca en diciembre).
function ym(n){ const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() + n); return d.toISOString().slice(0, 7); }
const off = () => S.history.filter(h => (h.mes || h.d.slice(0, 7)) >= ym(0)).length;
function monthLabel(i, long){
  const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() + i + off());
  return new Intl.DateTimeFormat("es-AR", {month: long ? "long" : "short", year:"numeric"}).format(d);
}
const monthKey = () => ym(off());
const activeCuotas = () => S.cuotas.filter(c => c.left > 0);
const activeDeudas = () => S.deudas.filter(d => d.balance > 0);
const totalPendiente = () => activeDeudas().reduce((a, d) => a + d.balance, 0) + activeCuotas().reduce((a, c) => a + c.amount * c.left, 0);
const fijoMes = () => activeCuotas().reduce((a, c) => a + c.amount, 0);
function minimoNecesario(){
  return fijoMes() + activeDeudas().reduce((a, d) => a + Math.min(d.balance * (1 + d.rate / 1200), d.min), 0);
}
function ordenAtaque(strategy){
  const ds = activeDeudas().slice();
  return strategy === "bola" ? ds.sort((a, b) => a.balance - b.balance) : ds.sort((a, b) => b.rate - a.rate || a.balance - b.balance);
}

/* ---------- Motor del plan: mes a mes ----------
   Cuotas = pago fijo que se descuenta del presupuesto. Cuando una termina, ese dinero
   pasa solo a la deuda objetivo (Efecto Cuota Liberada). Deudas con interés: se paga el
   mínimo de todas y el resto va a la objetivo (avalancha = mayor tasa, bola = menor saldo). */
function simulate(strategy, onlyMin){
  const D = activeDeudas().map(d => ({id:d.id, name:d.name, bal:d.balance, r:(d.rate || 0) / 1200, min:d.min || 0}));
  const C = activeCuotas().map(c => ({id:c.id, name:c.desc, amt:c.amount, left:c.left}));
  const budget = S.budget || 0;
  let m = 0, interest = 0, first = null;
  const events = [];
  while (m < 600) {
    const aD = D.filter(d => d.bal > 0.009), aC = C.filter(c => c.left > 0);
    if (!aD.length && !aC.length) break;
    const pay = {};
    let fixed = 0;
    aC.forEach(c => { fixed += c.amt; pay[c.id] = c.amt; c.left--; if (!c.left) events.push({m, type:"cuota", id:c.id, name:c.name, amt:c.amt}); });
    aD.forEach(d => { const i = d.bal * d.r; d.bal += i; interest += i; });
    let pool = budget - fixed;
    aD.forEach(d => { const p = Math.min(d.bal, d.min); d.bal -= p; pay[d.id] = p; pool -= p; });
    let target = null;
    if (!onlyMin && pool > 0.009) {
      const order = aD.filter(d => d.bal > 0.009).sort(strategy === "bola" ? (a, b) => a.bal - b.bal : (a, b) => b.r - a.r || a.bal - b.bal);
      for (const d of order) { if (pool <= 0.009) break; if (!target) target = d.id; const p = Math.min(pool, d.bal); d.bal -= p; pool -= p; pay[d.id] += p; }
    }
    aD.forEach(d => { if (d.bal <= 0.009) { d.bal = 0; events.push({m, type:"deuda", id:d.id, name:d.name}); } });
    if (m === 0) first = {pay, fixed, target, balances:Object.fromEntries(D.map(d => [d.id, r2(d.bal)]))};
    m++;
  }
  const done = !D.some(d => d.bal > 0.009) && !C.some(c => c.left > 0);
  return {months:m, done, interest, events, first};
}
function plan(){
  if (!activeDeudas().length && !activeCuotas().length) return {status:"vacio"};
  const need = minimoNecesario();
  if (activeDeudas().length && (!S.budget || S.budget + 0.009 < need)) return {status:"presupuesto", need};
  const sim = simulate(S.strategy, false);
  return {status:"ok", need, sim};
}

/* ---------- Render ---------- */
const view = document.getElementById("view");
function render(){
  document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-current", b.dataset.tab === tab ? "page" : "false"));
  view.innerHTML = ({inicio:vInicio, deudas:vDeudas, cuotas:vCuotas, calendario:vCalendario, plan:vPlan})[tab]();
}
function fechaTxt(sim){ return sim.done ? monthLabel(sim.months - 1, true) : "Más de 50 años"; }


/* ---------- Acelerador: cuánto adelantás sumando un extra por mes ---------- */
function acelerador(sim){
  if (!sim || !sim.done || !activeDeudas().length) return "";
  const base = S.budget;
  const rows = [0.1, 0.25, 0.5].map(p => {
    const extra = Math.ceil(base * p / 1000) * 1000;
    S.budget = base + extra; const s = simulate(S.strategy, false); S.budget = base;
    return {extra, s};
  }).filter(r => r.s.done && r.s.months < sim.months);
  S.budget = base;
  if (!rows.length) return "";
  return `<div class="card"><h2>Salí más rápido</h2>
    <p class="muted">Si sumás un extra por mes (aguinaldo, horas extra, una venta, una suscripción menos), adelantás tu fecha libre:</p>
    <table>${rows.map(r => `<tr><td><b>+ ${fmt(r.extra)}/mes</b></td><td>salís en <b>${esc(fechaTxt(r.s))}</b></td><td><span class="pill">${sim.months - r.s.months} ${sim.months - r.s.months === 1 ? "mes" : "meses"} antes</span></td></tr>`).join("")}</table>
    <p class="muted" style="margin-top:8px">El extra va todo a la deuda objetivo. Probá cambiar tu presupuesto arriba para ver tu número.</p></div>`;
}


/* ---------- Calendario: vencimientos y fechas importantes del plan ---------- */
let calM = 0;
function calItems(m, sim){
  const clear = {};
  if (sim) sim.events.forEach(e => { if (e.type === "deuda") clear[e.id] = e.m; });
  const out = [];
  activeCuotas().forEach(c => { if (m < c.left) out.push({day:c.due || 0, t:c.desc, amt:c.amount, imp: m === c.left - 1 ? "cuota" : ""}); });
  activeDeudas().forEach(d => { const e = clear[d.id]; if (e === undefined || m <= e) out.push({day:d.due || 0, t:d.name, amt:d.min, imp: e === m ? "deuda" : "", min:true}); });
  return out;
}

/* ---------- Calendario → archivo .ics (el calendario del celular avisa; la app no manda nada) ---------- */
const icsEsc = s => String(s).replace(/[\\;,]/g, "\\$&").replace(/\n/g, "\\n");
function descargarIcs(){
  const P = plan(), sim = P.status === "ok" ? P.sim : null, n = sim ? sim.months : 12;
  const pad = x => String(x).padStart(2, "0"), stamp = new Date().toISOString().replace(/[-:]|\.\d+/g, "");
  const f = d => `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}`;
  const ev = [];
  const add = (key, day, title, desc) => {
    const y = +key.slice(0, 4), mo = +key.slice(5, 7) - 1, dd = Math.min(day, new Date(y, mo + 1, 0).getDate());
    ev.push(["BEGIN:VEVENT", `UID:${uid()}${ev.length}@fechalibre`, `DTSTAMP:${stamp}`, `DTSTART;VALUE=DATE:${f(new Date(y, mo, dd))}`, `DTEND;VALUE=DATE:${f(new Date(y, mo, dd + 1))}`,
      `SUMMARY:${icsEsc(title)}`, `DESCRIPTION:${icsEsc(desc)}`, "BEGIN:VALARM", "ACTION:DISPLAY", `DESCRIPTION:${icsEsc(title)}`, "TRIGGER:-PT15H", "END:VALARM", "END:VEVENT"].join("\r\n"));
  };
  for (let m = 0; m < n; m++) {
    const key = ym(off() + m), items = calItems(m, sim);
    items.filter(i => i.day).forEach(i => add(key, i.day,
      `${i.imp === "cuota" ? "Última cuota: " : i.imp === "deuda" ? "Deuda saldada: " : i.min ? "Pago mínimo: " : "Vence: "}${i.t} (${fmt(i.amt)})`,
      "Fecha Libre. Las fechas del plan son estimaciones."));
    if (sim && sim.done && m === sim.months - 1) {
      const ds = items.filter(i => i.imp && i.day).map(i => i.day);
      add(key, ds.length ? Math.max(...ds) : 31, "Tu Fecha Libre", "Según tu plan, este mes terminás de pagar todo. Es una estimación.");
    }
  }
  if (!ev.length) return;
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Fecha Libre//ES\r\nCALSCALE:GREGORIAN\r\n" + ev.join("\r\n") + "\r\nEND:VCALENDAR\r\n"], {type:"text/calendar"}));
  a.download = "fecha-libre-calendario.ics";
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

/* ---------- Lectura del resumen PDF (en el dispositivo) ---------- */
let pdfjs = null;
function loadPdfJs(){
  if (pdfjs) return Promise.resolve(pdfjs);
  return new Promise((ok, fail) => {
    const s = document.createElement("script");
    s.src = "vendor/pdf.min.js";
    s.onload = () => { pdfjs = window.pdfjsLib; pdfjs.GlobalWorkerOptions.workerSrc = "vendor/pdf.worker.min.js"; ok(pdfjs); };
    s.onerror = () => fail(new Error("No se pudo cargar el lector de PDF. Revisá tu conexión."));
    document.head.appendChild(s);
  });
}
async function pdfLines(data){
  const lib = await loadPdfJs();
  const task = lib.getDocument({data, isEvalSupported:false});
  task.onPassword = (update, reason) => {
    const pw = prompt(reason === 2 ? "Contraseña incorrecta. Probá de nuevo:" : "El PDF tiene contraseña (muchos bancos usan tu DNI). Escribila para abrirlo:");
    if (pw === null) { task.destroy(); return; }
    update(pw);
  };
  const doc = await task.promise, lines = [];
  for (let p = 1; p <= doc.numPages; p++) {
    const page = await doc.getPage(p), tc = await page.getTextContent(), rows = [];
    tc.items.forEach(it => {
      if (!it.str || !it.str.trim()) return;
      const y = it.transform[5], x = it.transform[4];
      let row = rows.find(r => Math.abs(r.y - y) < 3);
      if (!row) rows.push(row = {y, parts:[]});
      row.parts.push({x, s:it.str});
    });
    rows.sort((a, b) => b.y - a.y).forEach(r => lines.push(r.parts.sort((a, b) => a.x - b.x).map(q => q.s).join(" ").replace(/\s+/g, " ").trim()));
  }
  return lines;
}
// Montos «45.000,00», «1,250.00», «15300,00». Las guardas evitan leer fechas (10.12.26) o años pegados como montos.
const AMT = /(?<![\d.,])-?\d{1,3}(?:[.,]\d{3})*[.,]\d{2}(?![.,]?\d)|(?<![\d.,])-?\d+[.,]\d{2}(?![.,]?\d)/g;
function parseAmount(s){
  s = s.replace(/\s/g, "");
  const neg = s.startsWith("-"); s = s.replace("-", "");
  const dec = s.slice(-3, -2);
  const intPart = s.slice(0, -3).replace(/[.,]/g, ""), cents = s.slice(-2);
  const n = parseFloat(intPart + "." + cents);
  return isFinite(n) ? (neg ? -n : n) : 0;
}
const CUOTA_RE = [
  /\b(?:CUOTAS?|CUOT|CTA|C)\s*\.?\s*(\d{1,2})\s*(?:\/|DE)\s*(\d{1,2})\b/i,
  /\b(\d{1,2})\s*DE\s*(\d{1,2})\s*(?:MSI|MESES)\b/i,
  /\bMSI\s*(\d{1,2})\s*(?:\/|DE)\s*(\d{1,2})\b/i
];
const SI_RE = /SIN\s*INTER|S\/\s*INT|\bMSI\b|MESES\s*SIN|0\s*%\s*INT|PLAN\s*Z|AHORA\s*(?:3|6|12|18|24)\b/;
function parseStatement(lines){
  const out = {cuotas:[], saldo:0, minimo:0, tna:0, card:""};
  const all = lines.join("\n");
  const brand = all.match(/AMERICAN EXPRESS|AMEX|MASTERCARD|MASTER CARD|VISA|CABAL|NARANJA|DINERS/i);
  out.card = brand ? brand[0].replace(/master card/i, "Mastercard").replace(/^\w/, c => c.toUpperCase()).replace(/\B\w+/g, w => w.toLowerCase()) : "Mi tarjeta";
  const seen = new Set();
  lines.forEach(line => {
    const up = line.toUpperCase();
    const amts = line.match(AMT) || [];
    if (!out.saldo && /SALDO ACTUAL|TOTAL A PAGAR|SALDO TOTAL|PAGO TOTAL|SALDO AL CORTE|SALDO DEUDOR/.test(up) && amts.length) out.saldo = parseAmount(amts[amts.length - 1]);
    if (!out.minimo && /PAGO M[IÍ]NIMO|M[IÍ]NIMO A PAGAR/.test(up) && amts.length) out.minimo = parseAmount(amts[amts.length - 1]);
    if (!out.tna) { const t = up.match(/(?:T\.?N\.?A\.?|TASA NOMINAL ANUAL|TASA ANUAL)[^\d]{0,30}(\d{1,3}(?:[.,]\d{1,3})?)\s*%?/); if (t) out.tna = parseFloat(t[1].replace(",", ".")); }
    for (const re of CUOTA_RE) {
      const m = line.match(re);
      if (!m) continue;
      const cur = +m[1], tot = +m[2];
      if (!(cur >= 1 && tot >= 2 && cur <= tot && tot <= 72)) continue;
      const after = line.slice(m.index + m[0].length).match(AMT) || [];
      const amount = Math.abs(parseAmount(after.length ? after[after.length - 1] : (amts[amts.length - 1] || "0")));
      if (!amount) continue;
      const desc = line.slice(0, m.index).replace(/^\s*\d{1,2}[-\/.]\d{1,2}(?:[-\/.]\d{2,4})?\s*/, "").replace(/^[\d\s*]+/, "").replace(AMT, "").replace(/[*_]+/g, " ").replace(/\s+/g, " ").trim().slice(0, 40) || "Compra en cuotas";
      const key = desc + "|" + cur + "/" + tot + "|" + amount;
      if (seen.has(key)) break;
      seen.add(key);
      out.cuotas.push({desc, cur, tot, amount, left: tot - cur + 1, si: SI_RE.test(up)});
      break;
    }
  });
  return out;
}
async function handlePdf(file){
  if (!file) return;
  openDlg(`<h2>Leyendo tu resumen…</h2><p class="muted">Se procesa en tu celular. Nada se sube.</p>`);
  try {
    const lines = await pdfLines(new Uint8Array(await file.arrayBuffer()));
    reviewImport(parseStatement(lines), lines.length);
  } catch(e) {
    openDlg(`<h2>No pudimos leer el PDF</h2><p class="muted">${esc(e && e.message || "Error desconocido")}. Si es una foto o un escaneo, cargá las cuotas a mano.</p>
      <button class="btn" data-action="add-cuota">Cargalo a mano</button><button class="btn ghost" data-action="close">Cerrar</button>`);
  }
}
let pending = null;
function reviewImport(r, nLines){
  pending = r;
  const sumCuotas = r.cuotas.reduce((a, c) => a + c.amount, 0);
  const resto = Math.max(0, r2(r.saldo - sumCuotas));
  openDlg(`<form id="fImport"><h2>${r.cuotas.length ? `Encontramos ${r.cuotas.length} ${r.cuotas.length === 1 ? "compra" : "compras"} en cuotas` : "No encontramos cuotas"}</h2>
    <p class="muted">${r.cuotas.length ? "Revisá y corregí antes de guardar. Destildá lo que no sea tuyo." : `Leímos ${nLines} líneas pero ninguna tenía el formato «cuota 3/12». Podés cargarlas a mano.`}</p>
    <div class="row"><div><label for="icard">Tarjeta</label><input id="icard" name="card" value="${esc(r.card)}" maxlength="30"></div>
    <div style="flex:.6"><label for="icur">Moneda</label><select id="icur" name="currency">${Object.keys(LOCALES).map(c => `<option ${c === S.currency ? "selected" : ""}>${c}</option>`).join("")}</select></div></div>
    ${r.cuotas.map((c, i) => `<div class="check" style="margin-top:8px"><input type="checkbox" name="on${i}" checked aria-label="Incluir ${esc(c.desc)}">
      <div style="flex:1"><input name="d${i}" value="${esc(c.desc)}" maxlength="40" aria-label="Descripción">
      <div class="row" style="margin-top:6px"><div><span class="muted">Cuota</span><input name="a${i}" type="number" step="any" min="0" value="${c.amount}" aria-label="Monto de la cuota"></div>
      <div><span class="muted">Faltan (era ${c.cur}/${c.tot})</span><input name="l${i}" type="number" min="1" max="120" value="${c.left}" aria-label="Cuotas que faltan"></div></div>
      <label class="check" style="border:0;padding:6px 0 0"><input type="checkbox" name="s${i}" ${c.si ? "checked" : ""}><span>Sin interés${c.si ? " <span class=\"muted\">(lo detectamos en tu resumen)</span>" : ""}</span></label></div></div>`).join("")}
    ${r.saldo ? `<div class="alert" style="margin-top:12px"><label class="check" style="border:0;padding:0"><input type="checkbox" name="addSaldo">
      <span>Si no vas a pagar el total, agregá el resto del saldo como deuda: <b>${fmt(resto)}</b>${r.tna ? ` · TNA ${r.tna}%` : ""} · mínimo ${fmt(minResto(r, sumCuotas, resto))}</span></label>
      <p class="muted" style="margin:6px 0 0">Saldo del resumen ${fmt(r.saldo)} menos las cuotas de este mes ${fmt(sumCuotas)}. Podés corregirlo después en Deudas.</p></div>` : ""}
    <div style="margin-top:14px">${r.cuotas.length || r.saldo ? `<button class="btn" type="submit">Guardar en mi plan</button>` : ""}
    <button class="btn alt" type="button" data-action="add-cuota">Cargalo a mano</button>
    <button class="btn ghost" type="button" data-action="close">Cancelar</button></div></form>`);
}
// El pago mínimo del resumen suele incluir las cuotas del mes; si no las cubre, se usa el 5% del resto.
const minResto = (r, sumCuotas, resto) => r.minimo > sumCuotas ? r2(r.minimo - sumCuotas) : r2(resto * 0.05);
function saveImport(form){
  const fd = new FormData(form), r = pending, card = (fd.get("card") || "").trim() || r.card;
  if (LOCALES[fd.get("currency")]) S.currency = fd.get("currency");
  let sumCuotas = 0;
  r.cuotas.forEach((c, i) => {
    if (!fd.get("on" + i)) return;
    const amount = num(fd.get("a" + i)), left = Math.round(num(fd.get("l" + i)));
    if (!amount || !left) return;
    sumCuotas += amount;
    S.cuotas.push({id:uid(), desc:(fd.get("d" + i) || "").trim() || c.desc, card, amount, left, total:c.tot, si:!!fd.get("s" + i)});
  });
  if (fd.get("addSaldo")) {
    const bal = Math.max(0, r2(r.saldo - sumCuotas));
    if (bal > 0) S.deudas.push({id:uid(), name:"Saldo " + card, balance:bal, rate:r.tna || 0, min:minResto(r, sumCuotas, bal)});
  }
  pending = null; save(); dlg.close(); tab = "cuotas"; render();
}

    if (!c.amount || !c.left) return;
    if (id) Object.assign(S.cuotas.find(x => x.id === id), c); else S.cuotas.push(Object.assign({id:uid()}, c));
  } else if (f.id === "fImport") { saveImport(f); return; }
  else return;
  save(); dlg.close(); render();
});
render();
</script>
</body>
